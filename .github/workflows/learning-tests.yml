name: Learning checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  learning:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm test
      - name: Check local-calendar behavior across DST
        run: TZ=America/New_York node --test tests/store.test.mjs
