<!doctype html>
<html lang="zh-Hant">
<head>

<body>
  <a class="skip" href="#content">跳到主要內容</a>
  <div class="frame">
    <header>
      <h1><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Body</h1>
      <nav aria-label="首頁分類"><a href="#comic">漫畫</a><a href="#languages">語言學習</a><a href="#nursing">護理</a><a href="#dream">夢想藍圖</a></nav>
    </header>
    <main id="content" class="board">
      <a id="dream" class="tile dream" href="./dream/">
        <img src="assets/earth-epic.webp" width="1180" height="1180" alt="" fetchpriority="high">
        <div class="feature-copy">
          <h2>夢想藍圖</h2>
          <p>從今天的英文練習，到我的赴美護理計畫。</p>
          <span class="hero-action">進入夢想藍圖 <span aria-hidden="true">→</span></span>
        </div>
      </a>

      <section id="languages" class="languages" aria-labelledby="lang-heading">
        <div class="hello-panel">
          <h2 id="lang-heading">語言學習</h2>
          <p class="greeting"><span lang="en">Hello.</span><span class="reply">哈囉</span></p>
        </div>
        <div class="course-row">
          <a class="tile course ja" href="japanese/"><span class="glyph" aria-hidden="true" lang="ja">あ</span><span class="course-label">日文</span><span class="arrow" aria-hidden="true">↗</span></a>
          <a class="tile course en" href="english/"><span class="glyph" aria-hidden="true" lang="en">Aa</span><span class="course-label">英文 <small>籌備中</small></span><span class="arrow" aria-hidden="true">↗</span></a>
          <a class="tile course ko" href="korean/"><span class="glyph" aria-hidden="true" lang="ko">한</span><span class="course-label">韓文</span><span class="arrow" aria-hidden="true">↗</span></a>
        </div>
      </section>

      <a id="comic" class="tile comic" href="./comic/">
        <img src="comic/assets/hero-tall.webp" width="900" height="1599" alt="">
        <h2>漫畫</h2><span class="open" aria-hidden="true">↗</span>
        <div class="comic-copy"><strong>西天</strong><p>第一章〈望川鎮的失蹤者〉</p></div>
      </a>

      <a class="tile vocab tool" href="vocabulary/">
        <span class="cards" aria-hidden="true"><i></i><b>字</b></span>
        <div><h2>今日單字</h2><p id="daily-word-summary">日文與韓文 · 每日 10 張字卡</p></div>
      </a>

      <a class="tile progress tool" href="progress/">
        <span class="steps" aria-hidden="true"><i></i><i></i><i></i></span>
        <div><h2>學習進度</h2><p id="learning-progress-summary">課程與複習紀錄</p></div>
      </a>

      <a id="nursing" class="tile nursing" href="nursing/">
        <span class="pulse" aria-hidden="true"></span>
        <div class="feature-copy"><h2>護理</h2><p>內科黑板課</p></div>
        <span class="open" aria-hidden="true">↗</span>
      </a>

      <a class="practice" href="dream/#library"><span aria-hidden="true" class="chat"><i></i></span><strong>英文練習</strong><span class="practice-arrow" aria-hidden="true">→</span></a>
    </main>
  </div>
