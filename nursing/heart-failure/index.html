<!doctype html>

<title>心衰竭黑板課</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}
/* Layout: one 16:10 slate board drawn in SVG; title row, 左心 | 右心 columns with sketches, 護理 + 秒殺 along the bottom; controls under the chalk tray */
:root{color-scheme:dark;
  --room:#151819;--slate:#23312b;--slate-2:#1a2520;--frame:#6b4a2f;
  --chalk:#eceae1;--dim:#aab4ac;--yellow:#f3da78;--pink:#f2a9a0;--blue:#9fcbe8;
  --ui:#e7e4dc;--ui-dim:#9aa19c;--btn-ink:#1b2722;
  --sans:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
html,body{background:var(--room);color:var(--ui)}
body{font-family:var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.scroller{overflow-x:auto;border-radius:8px}
.board{position:relative;min-width:760px;border:10px solid var(--frame);border-radius:8px;
  background:radial-gradient(120% 90% at 30% 20%,var(--slate) 0%,var(--slate-2) 100%);
  box-shadow:inset 0 0 70px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.45);line-height:0}
.board svg{width:100%;height:auto;display:block}
.chalk-unused{position:absolute;left:0;top:0;width:30px;height:9px;margin:-2px 0 0 -3px;background:var(--chalk);border-radius:2px;transform-origin:0 50%;transform:rotate(-30deg);box-shadow:0 2px 4px rgba(0,0,0,.45);opacity:0;transition:opacity .25s;pointer-events:none}
.intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;line-height:1.4;text-align:center;color:var(--chalk)}
.intro b{font-size:clamp(28px,4vw,48px);font-weight:600;letter-spacing:.04em}
.intro span{color:var(--dim);font-size:clamp(15px,1.6vw,19px)}
.intro[hidden]{display:none}
.tray{height:10px;margin-top:-14px;background:var(--frame);border-radius:0 0 6px 6px;opacity:.7}
.hint{display:none;font-size:13px;color:var(--ui-dim)}
@media (max-width:760px){.hint{display:block}}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
button{font:600 15px/1 var(--sans);border-radius:999px;padding:12px 20px;cursor:pointer;border:1px solid rgba(231,228,220,.25);background:transparent;color:var(--ui)}
button.main{background:var(--yellow);color:var(--btn-ink);border-color:var(--yellow)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.dots{display:flex;gap:6px;margin-left:auto}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(231,228,220,.2)}
.dots i.done{background:var(--ui-dim)}.dots i.now{background:var(--yellow)}
.cap{min-height:3.4em;font-size:16px;line-height:1.7;background:rgba(255,255,255,.04);border-radius:10px;padding:12px 16px}
.cap[hidden]{display:none}
.back{color:var(--ui-dim);text-decoration:none;font-size:14px}.back:hover{color:var(--yellow)}
.foot{font-size:12px;color:var(--ui-dim)}
</style>
</head>

  T(90,1000,68,"chalk","【R】ight = 【R】est of body",640),
  P("chalk",4,circ(870,998,14),"M870,1012 L870,1064","M846,1032 L894,1032","M870,1064 L852,1108","M870,1064 L888,1108")]
];
const PAGE=[0,0,0,0,1,1];
const NS="http://www.w3.org/2000/svg",$=id=>document.getElementById(id);
const ink=$("ink"),board=$("board"),cap=$("cap");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const audios=AUD.map(s=>{const a=new Audio(s);a.preload="auto";return a});
let cur=-1,token=0,capOn=true,uid=0;
STEPS.forEach(()=>$("dots").appendChild(document.createElement("i")));
const mk=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
const plen=pts=>{let L=0;for(let i=1;i<pts.length;i++)L+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);return L};
// custom marks in a 1x1 box: [advance, [paths]]
const CUSTOM={"→":[1.05,["M0.06,0.5 L0.92,0.5","M0.7,0.3 L0.94,0.5 L0.7,0.7"]],"、":[.5,["M0.14,0.66 L0.3,0.84"]],
 "・":[.62,["M0.28,0.52 a0.04,0.04 0 1,0 0.08,0 a0.04,0.04 0 1,0 -0.08,0"]],"：":[.55,["M0.24,0.36 l0.02,0.02","M0.24,0.74 l0.02,0.02"]],
 "＋":[.8,["M0.4,0.28 L0.4,0.78","M0.15,0.53 L0.65,0.53"]],"↑":[.6,["M0.3,0.86 L0.3,0.18","M0.12,0.38 L0.3,0.16 L0.48,0.38"]]};
const segs=t=>{const out=[];let hl=false;for(const ch of Array.from(t)){if(ch==="【"){hl=true;continue}if(ch==="】"){hl=false;continue}out.push([ch,hl])}return out};
function measure(t,s){let w=0;for(const [ch] of segs(t)){if(HZ[ch])w+=s;else if(CUSTOM[ch])w+=CUSTOM[ch][0]*s;else if(ch===" ")w+=.3*s;else if(LAT[ch])w+=LAT[ch].o*2*(.6*s/21)+.04*s;else w+=.5*s}return w}
// build strokes for one step: returns list of {kind, el, len, dur, pt(t)->[x,y] svg-local coords mapped later}
function build(i){
  const g=mk("g",{"data-step":i},ink),list=[];
  for(const it of STEPS[i]){
    if(it.k==="p"){for(const d of it.d){const p=mk("path",{d,fill:"none",stroke:C[it.c],"stroke-width":it.w,"stroke-linecap":"round","stroke-linejoin":"round"},g);const L=p.getTotalLength();p.style.strokeDasharray=L+" "+(L+2);p.style.strokeDashoffset=L;list.push({el:p,len:L,dur:120+L*3.2,pt:t=>{const q=p.getPointAtLength(t*L);return[q.x,q.y]}})}continue}
    let s=it.s;if(it.m){const w=measure(it.t,s);if(w>it.m)s=s*it.m/w}
    let x=it.x;const y=it.y;
    for(const [ch,hl] of segs(it.t)){
      const col=hl?C.yellow:C[it.c];
      if(HZ[ch]){
        const k=s/1024,cg=mk("g",{transform:`translate(${x},${y}) scale(${k}) translate(0,900) scale(1,-1)`},g);
        HZ[ch].strokes.forEach((sd,j)=>{
          const id="c"+(uid++),cp=mk("clipPath",{id},cg);mk("path",{d:sd},cp);
          const m=HZ[ch].medians[j],L=plen(m)+60;
          const p=mk("path",{d:"M"+m.map(q=>q.join(",")).join(" L"),fill:"none",stroke:col,"stroke-width":150,"stroke-linecap":"round","stroke-linejoin":"round","clip-path":`url(#${id})`},cg);
          p.style.strokeDasharray=L+" "+(L+2);p.style.strokeDashoffset=L;
          const len=L*k;list.push({el:p,len,dur:160+len*4.2,pt:t=>{const q=p.getPointAtLength(Math.min(t*L,L-60));return mapPt(p,q)}});
        });x+=s;
      }else if(CUSTOM[ch]||LAT[ch]){
        let paths,tr,adv;
        if(CUSTOM[ch]){adv=CUSTOM[ch][0]*s;paths=CUSTOM[ch][1];tr=`translate(${x},${y}) scale(${s})`}
        else{const k=.6*s/21;adv=LAT[ch].o*2*k+.04*s;paths=LAT[ch].d.split(/(?=M)/);tr=`translate(${x},${y+.86*s-22*k}) scale(${k})`}
        const cg=mk("g",{transform:tr},g),sw=s*.075;
        for(const d of paths){const p=mk("path",{d,fill:"none",stroke:col,"stroke-width":1,"vector-effect":"non-scaling-stroke","stroke-linecap":"round","stroke-linejoin":"round"},cg);
          p.style.strokeWidth=sw*scaleOf(board)+"px";
          const L=p.getTotalLength();p.style.strokeDasharray=L+" "+(L+2);p.style.strokeDashoffset=L;
          const ks=CUSTOM[ch]?s:.6*s/21;list.push({el:p,len:L*ks,dur:110+L*ks*3.6,pt:t=>mapPt(p,p.getPointAtLength(t*L)),nss:sw})}
        x+=adv;
      }else x+=ch===" "?.3*s:.5*s;
    }
  }
  return list;
}
function scaleOf(){const r=$("svg").getBoundingClientRect();return r.width/1600||1}
function erase(cb){const r=mk("rect",{x:0,y:0,width:0,height:1200,fill:"#1f2b25"},$("svg"));const st=performance.now(),my=token;(function f(n){if(my!==token){r.remove();return}const p=Math.min(1,(n-st)/700);r.setAttribute("width",1600*p);if(p<1)requestAnimationFrame(f);else{clearBoard();r.remove();cb()}})(st)}
function mapPt(el,q){const m=el.getScreenCTM(),b=board.getBoundingClientRect();const pt=$("svg").createSVGPoint();pt.x=q.x;pt.y=q.y;const r=pt.matrixTransform(m);return[r.x-b.left-10,r.y-b.top-10]}
function rescale(){const k=scaleOf();ink.querySelectorAll("path[vector-effect]").forEach(p=>{const s=parseFloat(p.dataset.sw||0)})}
function fixWidths(list){const k=scaleOf();list.forEach(o=>{if(o.nss)o.el.style.strokeWidth=(o.nss*k)+"px"})}
let allNss=[];
addEventListener("resize",()=>{const k=scaleOf();allNss.forEach(o=>o.el.style.strokeWidth=(o.nss*k)+"px")});
function stopAll(){token++;audios.forEach(a=>{a.pause();a.currentTime=0})}
function clearBoard(){ink.innerHTML="";allNss=[]}
function showInstant(i){const l=build(i);fixWidths(l);allNss.push(...l.filter(o=>o.nss));l.forEach(o=>o.el.style.strokeDashoffset=0)}
function redrawUpTo(n,pg){clearBoard();for(let i=0;i<n;i++)if(PAGE[i]===pg)showInstant(i)}
function animate(i){
  const my=++token,list=build(i);fixWidths(list);allNss.push(...list.filter(o=>o.nss));
  const a=audios[i];a.currentTime=0;a.play().catch(()=>{});cap.textContent=NAR[i];
  if(reduce){list.forEach(o=>o.el.style.strokeDashoffset=0);return}
  const GAP=70;let nat=list.reduce((s,o)=>s+o.dur+GAP,0);const target=DUR[i]*1000*.86;const f=nat>target?Math.max(.42,target/nat):1;
  let t0=0;const sched=list.map(o=>{const st=t0,d=o.dur*f;t0+=d+GAP*f;return{...o,st,d}});
  const start=performance.now();let idx=0;
  (function frame(now){
    if(my!==token)return;const t=now-start;
    while(idx<sched.length&&t>=sched[idx].st+sched[idx].d){const o=sched[idx];o.el.style.strokeDashoffset=0;idx++}
    if(idx>=sched.length)return;
    const o=sched[idx];if(t>=o.st){const p=(t-o.st)/o.d,L=parseFloat(o.el.style.strokeDasharray);o.el.style.strokeDashoffset=L*(1-p)}
    requestAnimationFrame(frame);
  })(start);
}
function ui(){[...$("dots").children].forEach((d,i)=>d.className=i<cur?"done":i===cur?"now":"");
  $("replay").disabled=cur<0;$("prev").disabled=cur<=0;
  $("next").textContent=cur<0?"開始上課 ▶":cur>=STEPS.length-1?"再上一次 ⟲":"下一段 ▶"}
$("next").onclick=()=>{stopAll();$("intro").hidden=true;if(cur>=STEPS.length-1){cur=-1;clearBoard()}if(cur>=0)redrawUpTo(cur+1,PAGE[cur]);const prevPg=cur>=0?PAGE[cur]:PAGE[0];cur++;ui();if(PAGE[cur]!==prevPg){erase(()=>animate(cur))}else animate(cur)};
$("replay").onclick=()=>{if(cur<0)return;stopAll();redrawUpTo(cur,PAGE[cur]);animate(cur);ui()};
$("prev").onclick=()=>{if(cur<=0)return;stopAll();cur--;redrawUpTo(cur,PAGE[cur]);animate(cur);ui()};
$("capBtn").onclick=e=>{capOn=!capOn;cap.hidden=!capOn;e.currentTarget.textContent="字幕："+(capOn?"開":"關");e.currentTarget.setAttribute("aria-pressed",capOn)};
ui();
</script>
